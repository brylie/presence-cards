      <stop offset="0%" stop-color="#fbfcfa"/>
      <stop offset="55%" stop-color="#f2f4f0"/>
      <stop offset="100%" stop-color="#e9ede8"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="#e4efe9" opacity="0.55"/>
