  <text x="330" y="290" font-family="Iowan Old Style, Georgia, serif" font-size="76" fill="#1c2420">Presence Cards</text>
  <text x="332" y="350" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#4b564f">A quiet companion for meeting a human</text>
  <text x="332" y="392" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#4b564f">experience with attention.</text>

  <text x="332" y="470" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="24" fill="#2f6f5e" letter-spacing="0.5">Not a mood tracker. Not a game. A companion, not a weapon.</text>
